<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#05080D">

<title>Listing • PostX</title>

<style>
:root{
  --bg:#05080D;
  --bg2:#08111B;
  --card:#0B1622;
  --card2:#102031;
  --cyan:#00E5FF;
  --cyan-bd:rgba(0,229,255,.18);
  --bd:rgba(255,255,255,.07);
  --text:#F4F8FB;
  --mut:#718292;
  --green:#21D07A;
  --red:#FF5C6C;
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  background:
    radial-gradient(circle at top,rgba(0,229,255,.06),transparent 35%),
    var(--bg);
  color:var(--text);
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  max-width:600px;
  margin:0 auto;
  min-height:100vh;
  padding-bottom:30px;
}

.top{
  padding:16px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
}

.back{
  color:var(--cyan);
  text-decoration:none;
  font-size:14px;
  font-weight:700;
}

.market{
  color:var(--mut);
  text-decoration:none;
  font-size:12px;
}

.card{
  margin:0 16px;
  background:var(--card);
  border:1px solid var(--bd);
  border-radius:18px;
  overflow:hidden;
  box-shadow:0 12px 40px rgba(0,0,0,.28);
}

.image-wrap{
  height:360px;
  background:var(--bg2);
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}

.image-wrap img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

.no-photo{
  color:var(--mut);
  text-align:center;
  padding:30px;
  font-size:14px;
}

.status{
  position:absolute;
  top:14px;
  left:14px;
  background:rgba(5,8,13,.82);
  border:1px solid var(--cyan-bd);
  color:var(--cyan);
  backdrop-filter:blur(10px);
  padding:7px 11px;
  border-radius:20px;
  font-size:10px;
  font-weight:800;
  letter-spacing:.3px;
}

.info{
  padding:18px;
}

.category{
  color:var(--cyan);
  font-size:11px;
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:.6px;
  margin-bottom:8px;
}

.title{
  font-size:23px;
  line-height:1.25;
  margin-bottom:8px;
}

.price{
  color:var(--cyan);
  font-size:24px;
  font-weight:900;
}

.meta{
  color:var(--mut);
  font-size:12px;
  margin-top:8px;
  line-height:1.6;
}

.description{
  color:#A9B6C1;
  font-size:14px;
  line-height:1.65;
  margin-top:15px;
}

.seller{
  margin-top:18px;
  padding:13px;
  background:var(--card2);
  border:1px solid var(--bd);
  border-radius:13px;
}

.seller-title{
  font-size:11px;
  color:var(--mut);
  margin-bottom:5px;
}

.seller-name{
  font-size:14px;
  font-weight:800;
}

.rating{
  color:#FFD166;
  font-size:12px;
  margin-top:4px;
}

.actions{
  display:flex;
  gap:10px;
  margin-top:18px;
}

.btn{
  flex:1;
  min-height:48px;
  padding:13px 12px;
  border-radius:12px;
  border:1px solid var(--bd);
  font-size:13px;
  font-weight:800;
  text-decoration:none;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
}

.message{
  background:var(--card2);
  border-color:var(--cyan-bd);
  color:var(--cyan);
}

.boost{
  background:var(--cyan);
  color:#05080D;
  border-color:var(--cyan);
}

.boost.hidden{
  display:none;
}

.details{
  margin-top:18px;
  border-top:1px solid var(--bd);
  padding-top:16px;
}

.detail-row{
  display:flex;
  justify-content:space-between;
  gap:15px;
  padding:9px 0;
  font-size:12px;
}

.detail-label{
  color:var(--mut);
}

.detail-value{
  color:var(--text);
  font-weight:700;
  text-align:right;
}

.error{
  margin:30px 16px;
  padding:25px 18px;
  text-align:center;
  background:var(--card);
  border:1px solid var(--bd);
  border-radius:16px;
}

.error h2{
  font-size:18px;
  margin-bottom:8px;
}

.error p{
  color:var(--mut);
  font-size:13px;
  line-height:1.5;
}

.error a{
  display:inline-block;
  margin-top:15px;
  color:var(--cyan);
  text-decoration:none;
  font-weight:800;
}

@media(max-width:420px){
  .image-wrap{
    height:300px;
  }

  .title{
    font-size:21px;
  }

  .price{
    font-size:22px;
  }

  .actions{
    flex-direction:column;
  }
}
</style>
</head>

<body>

<header class="top">
  <a class="back" href="marketplace.html">← Marketplace</a>
  <a class="market" href="index.html">PostX</a>
</header>

<main id="listingContainer"></main>

<script>
(function(){

  const container = document.getElementById("listingContainer");

  let posts = [];

  try{
    posts = JSON.parse(
      localStorage.getItem("postx_posts") || "[]"
    );
  }catch(error){
    posts = [];
  }

  const params = new URLSearchParams(window.location.search);
  const requestedId = params.get("id");

  /*
    Find the requested listing.
    If no ID exists, use the first marketplace post.
  */
  let post = requestedId
    ? posts.find(item => String(item.id) === String(requestedId))
    : posts[0];

  /*
    Demo fallback.
    Remove this object if you want listing.html
    to show ONLY real marketplace listings.
  */
  if(!post && posts.length === 0){
    post = {
      id:"demo",
      caption:"Premium Sneakers",
      price:3500,
      category:"Fashion",
      location:"Mariakani",
      seller:"PostX Seller",
      rating:"4.8",
      mediaUrl:"",
      boosted:false,
      description:
        "Quality sneakers available now. Sizes 39–44. Delivery available in Mariakani, Kilifi, Mombasa and Kwale."
    };
  }

  if(!post){
    container.innerHTML = `
      <section class="error">
        <h2>Listing not found</h2>
        <p>
          This listing may have been removed or is no longer available.
        </p>
        <a href="marketplace.html">← Return to Marketplace</a>
      </section>
    `;
    return;
  }

  const title =
    post.title ||
    post.caption?.slice(0,80) ||
    "PostX Listing";

  const description =
    post.description ||
    post.caption ||
    "No description provided.";

  const price =
    Number(post.price) > 0
      ? "KSh " + Number(post.price).toLocaleString("en-KE")
      : "Price on request";

  const category =
    post.category ||
    post.type ||
    "Marketplace";

  const location =
    post.location ||
    "Kenya";

  const seller =
    post.seller ||
    post.author ||
    "PostX Seller";

  const rating =
    post.rating ||
    "—";

  const image =
    post.mediaUrl ||
    post.image ||
    post.imageUrl ||
    "";

  const boosted =
    post.boosted === true ||
    post.isBoosted === true ||
    post.status === "boosted";

  const imageHTML = image
    ? `<img
         src="${escapeHTML(image)}"
         alt="${escapeHTML(title)}"
         onerror="showNoPhoto(this)"
       >`
    : `<div class="no-photo">📷<br><br>No photo available</div>`;

  container.innerHTML = `
    <article class="card">

      <div class="image-wrap">

        ${imageHTML}

        ${
          boosted
          ? `<div class="status">⚡ BOOSTED</div>`
          : ""
        }

      </div>

      <div class="info">

        <div class="category">
          ${escapeHTML(category)}
        </div>

        <h1 class="title">
          ${escapeHTML(title)}
        </h1>

        <div class="price">
          ${escapeHTML(price)}
        </div>

        <div class="meta">
          📍 ${escapeHTML(location)}
        </div>

        <p class="description">
          ${escapeHTML(description)}
        </p>

        <div class="seller">

          <div class="seller-title">
            SELLER
          </div>

          <div class="seller-name">
            ${escapeHTML(seller)}
          </div>

          <div class="rating">
            ★ ${escapeHTML(String(rating))}
          </div>

        </div>

        <div class="actions">

          <a
            class="btn message"
            href="inbox.html"
          >
            💬 Message Seller
          </a>

          <a
            id="boostButton"
            class="btn boost ${boosted ? "hidden" : ""}"
            href="boost.html?id=${encodeURIComponent(post.id || "")}"
          >
            🚀 Boost This
          </a>

        </div>

        <div class="details">

          <div class="detail-row">
            <span class="detail-label">Listing ID</span>
            <span class="detail-value">
              ${escapeHTML(String(post.id || "—"))}
            </span>
          </div>

          <div class="detail-row">
            <span class="detail-label">Category</span>
            <span class="detail-value">
              ${escapeHTML(category)}
            </span>
          </div>

          <div class="detail-row">
            <span class="detail-label">Location</span>
            <span class="detail-value">
              ${escapeHTML(location)}
            </span>
          </div>

          <div class="detail-row">
            <span class="detail-label">Status</span>
            <span class="detail-value">
              ${boosted ? "Boosted" : "Active"}
            </span>
          </div>

        </div>

      </div>

    </article>
  `;

  document.title = title + " • PostX";

  window.showNoPhoto = function(img){

    const wrapper = img.parentElement;

    wrapper.innerHTML =
      '<div class="no-photo">📷<br><br>No photo available</div>' +
      (boosted
        ? '<div class="status">⚡ BOOSTED</div>'
        : '');
  };

  function escapeHTML(value){
    return String(value ?? "")
      .replace(/&/g,"&amp;")
      .replace(/</g,"&lt;")
      .replace(/>/g,"&gt;")
      .replace(/"/g,"&quot;")
      .replace(/'/g,"&#039;");
  }

})();
</script>

</body>
</html>
