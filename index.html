<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#0f172a"
  >

  <meta
    name="description"
    content="PostX - Smart Social Media Publisher"
  >

  <meta
    name="mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="apple-mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="black-translucent"
  >

  <meta
    name="apple-mobile-web-app-title"
    content="PostX"
  >

  <title>PostX - Smart Social Media Publisher</title>

  <link
    rel="manifest"
    href="manifest.json"
  >

  <link
    rel="stylesheet"
    href="css/style.css"
  >

  <link
    rel="icon"
    href="assets/icons/icon-192.png"
    type="image/png"
  >
</head>

<body>

  <!--
  =========================================================
                         POSTX
              Smart Social Media Publisher
  =========================================================

  The application interface is created by:

      js/app.js

  Keeping this HTML foundation intentionally lightweight
  allows the JavaScript application engine to control:

      - Navigation
      - Dashboard
      - Create Post
      - Drafts
      - Scheduled Posts
      - Published Posts
      - Calendar
      - LocalStorage
      - Mobile navigation
      - PWA behavior

  =========================================================
  -->

  <div id="postx-app"></div>

  <noscript>
    <div
      style="
        max-width:600px;
        margin:60px auto;
        padding:24px;
        font-family:system-ui,sans-serif;
        text-align:center;
      "
    >
      <h1>PostX</h1>

      <p>
        JavaScript is required to use PostX.
        Please enable JavaScript in your browser
        and reload the application.
      </p>
    </div>
  </noscript>

  <script
    src="js/app.js"
    defer
  ></script>

</body>
</html>
