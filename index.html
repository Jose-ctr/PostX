<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#070D18"
  >

  <meta
    name="color-scheme"
    content="dark"
  >

  <meta
    name="description"
    content="PostX - Smart Social Media Publisher"
  >

  <meta
    name="mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="apple-mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="black-translucent"
  >

  <meta
    name="apple-mobile-web-app-title"
    content="PostX"
  >

  <title>PostX - Smart Social Media Publisher</title>

  <!-- PWA -->
  <link
    rel="manifest"
    href="manifest.json"
  >

  <!-- PostX stylesheet -->
  <link
    rel="stylesheet"
    href="css/style.css?v=9"
  >

  <!-- Original PostX brand icon -->
  <link
    rel="icon"
    href="assets/icons/icon-192.png"
    type="image/png"
  >

  <link
    rel="apple-touch-icon"
    href="assets/icons/icon-192.png"
  >
</head>

<body>

  <!--
    =====================================================
                         POSTX
              Smart Social Media Publisher
    =====================================================

    Main application container.

    js/app.js controls:
    - Dashboard
    - Navigation
    - Create Post
    - Drafts
    - Scheduled Posts
    - Published Posts
    - Calendar
    - LocalStorage
    - Mobile navigation
    - PWA functionality
  -->

  <div id="postx-app"></div>

  <!-- JavaScript disabled message -->
  <noscript>
    <div
      style="
        min-height:100vh;
        display:flex;
        align-items:center;
        justify-content:center;
        padding:24px;
        background:#070D18;
        color:#F4F8FC;
        font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
        text-align:center;
      "
    >
      <div
        style="
          width:100%;
          max-width:480px;
          padding:32px 24px;
          background:#101B2D;
          border:1px solid rgba(42,229,255,.15);
          border-radius:20px;
        "
      >
        <h1 style="margin:0 0 10px;">
          PostX
        </h1>

        <p
          style="
            margin:0;
            color:#94A3B8;
            line-height:1.6;
          "
        >
          JavaScript is required to use PostX.
          Please enable JavaScript and reload the application.
        </p>
      </div>
    </div>
  </noscript>

  <!-- PostX application engine -->
  <script
    src="js/app.js"
    defer
  ></script>

</body>
</html>
