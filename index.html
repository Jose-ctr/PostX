<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta name="theme-color" content="#000000">

  <meta
    name="description"
    content="PostX — Create posts, marketplace listings and video stories."
  >

  <title>Create — PostX</title>

  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="assets/icons/icon-192.png">

  <link rel="stylesheet" href="css/style.css?v=10">

  <style>
    :root {
      --px-bg: #000000;
      --px-card: #212528;
      --px-surface: #4B4F52;
      --px-border: #555B5E;
      --px-text: #ffffff;
      --px-muted: #D0D5D8;
      --px-lime: #A6FF7F;
      --px-danger: #ff5c6c;
      --px-radius: 18px;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      background: var(--px-bg);
      color-scheme: dark;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--px-bg);
      color: var(--px-text);
      font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      font-size: 15px;
      line-height: 1.45;
      padding-bottom: 90px;
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .app {
      width: 100%;
      max-width: 760px;
      margin: 0 auto;
      padding: 14px 14px 30px;
    }

    /* HEADER */

    .topbar {
      min-height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: var(--px-text);
      min-width: 0;
    }

    .brand-logo {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      object-fit: cover;
      background: var(--px-card);
      border: 1px solid var(--px-border);
    }

    .brand-name {
      font-size: 20px;
      font-weight: 900;
      letter-spacing: -0.5px;
    }

    .brand-sub {
      color: var(--px-muted);
      font-size: 12px;
      margin-top: -2px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .icon-btn {
      width: 44px;
      height: 44px;
      border: 1px solid var(--px-border);
      border-radius: 14px;
      background: var(--px-card);
      color: var(--px-text);
      display: grid;
      place-items: center;
      font-size: 19px;
      text-decoration: none;
    }

    .icon-btn:active {
      transform: scale(.96);
    }

    /* HERO */

    .hero {
      margin-top: 6px;
      margin-bottom: 18px;
    }

    .hero h1 {
      margin: 0;
      font-size: clamp(27px, 7vw, 38px);
      line-height: 1.05;
      letter-spacing: -1px;
      font-weight: 900;
    }

    .hero h1 span {
      color: var(--px-lime);
    }

    .hero p {
      margin: 9px 0 0;
      color: var(--px-muted);
      font-size: 15px;
    }

    /* TYPE SELECTOR */

    .type-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 9px;
      margin-bottom: 14px;
    }

    .type-btn {
      min-height: 94px;
      padding: 12px 8px;
      border: 1px solid var(--px-border);
      border-radius: var(--px-radius);
      background: var(--px-card);
      color: var(--px-text);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: .15s ease;
    }

    .type-btn .icon {
      font-size: 25px;
    }

    .type-btn strong {
      font-size: 13px;
      font-weight: 850;
    }

    .type-btn small {
      color: var(--px-muted);
      font-size: 10px;
    }

    .type-btn.active {
      border: 2px solid var(--px-lime);
      background: #171a1b;
    }

    .type-btn.active small {
      color: var(--px-lime);
    }

    .type-btn:active {
      transform: scale(.98);
    }

    /* CARD */

    .card {
      background: var(--px-card);
      border: 1px solid var(--px-border);
      border-radius: var(--px-radius);
      padding: 15px;
      margin-bottom: 14px;
      box-shadow: 0 8px 24px rgba(0,0,0,.28);
    }

    .card-title {
      margin: 0 0 12px;
      font-size: 16px;
      font-weight: 850;
    }

    /* USER */

    .user-row {
      display: flex;
      align-items: center;
      gap: 11px;
      margin-bottom: 13px;
    }

    .avatar {
      width: 44px;
      height: 44px;
      flex: 0 0 44px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: var(--px-surface);
      border: 1px solid var(--px-border);
      font-weight: 900;
      color: var(--px-lime);
    }

    .user-name {
      font-weight: 850;
      font-size: 15px;
    }

    .user-label {
      color: var(--px-muted);
      font-size: 12px;
    }

    /* INPUTS */

    textarea,
    input,
    select {
      width: 100%;
      color: var(--px-text);
      background: #111416;
      border: 1px solid var(--px-border);
      border-radius: 14px;
      outline: none;
    }

    textarea {
      min-height: 145px;
      resize: vertical;
      padding: 14px;
      font-size: 16px;
      line-height: 1.5;
    }

    input,
    select {
      min-height: 48px;
      padding: 11px 13px;
      font-size: 15px;
    }

    textarea::placeholder,
    input::placeholder {
      color: #AEB5B9;
    }

    textarea:focus,
    input:focus,
    select:focus {
      border-color: var(--px-lime);
      box-shadow: 0 0 0 2px rgba(166,255,127,.12);
    }

    .field {
      margin-top: 12px;
    }

    .field-label {
      display: block;
      margin-bottom: 7px;
      font-size: 13px;
      font-weight: 800;
      color: var(--px-text);
    }

    /* MEDIA */

    .media-box {
      border: 1px dashed #73797c;
      border-radius: 15px;
      min-height: 100px;
      background: #111416;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 16px;
      margin-top: 12px;
    }

    .media-box label {
      width: 100%;
      cursor: pointer;
    }

    .media-icon {
      font-size: 29px;
      display: block;
      margin-bottom: 5px;
    }

    .media-main {
      font-weight: 850;
      font-size: 14px;
    }

    .media-sub {
      display: block;
      color: var(--px-muted);
      font-size: 12px;
      margin-top: 3px;
    }

    #mediaInput {
      display: none;
    }

    .preview {
      display: none;
      margin-top: 12px;
      overflow: hidden;
      border-radius: 15px;
      border: 1px solid var(--px-border);
      background: #000;
    }

    .preview img,
    .preview video {
      display: block;
      width: 100%;
      max-height: 380px;
      object-fit: contain;
    }

    /* PRICE */

    .price-row {
      display: grid;
      grid-template-columns: 110px 1fr;
      gap: 9px;
    }

    .price-row select {
      min-width: 0;
    }

    /* PLATFORM */

    .platforms {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .platform {
      min-height: 50px;
      border: 1px solid var(--px-border);
      border-radius: 13px;
      background: #111416;
      color: var(--px-text);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      font-size: 12px;
      font-weight: 800;
    }

    .platform input {
      width: 17px;
      height: 17px;
      accent-color: var(--px-lime);
    }

    .platform:has(input:checked) {
      border-color: var(--px-lime);
      color: var(--px-lime);
    }

    /* BOOST */

    .boost-box {
      display: flex;
      align-items: flex-start;
      gap: 11px;
      padding: 13px;
      border: 1px solid var(--px-border);
      border-radius: 15px;
      background: #111416;
    }

    .boost-box input {
      width: 20px;
      height: 20px;
      margin-top: 2px;
      accent-color: var(--px-lime);
      flex: 0 0 auto;
    }

    .boost-title {
      font-size: 14px;
      font-weight: 850;
    }

    .boost-description {
      color: var(--px-muted);
      font-size: 12px;
      margin-top: 3px;
    }

    .boost-price {
      color: var(--px-lime);
      font-weight: 900;
      margin-top: 4px;
      font-size: 13px;
    }

    /* POST BUTTON */

    .publish-btn {
      width: 100%;
      min-height: 54px;
      border: 0;
      border-radius: 16px;
      background: var(--px-lime);
      color: #071006;
      font-size: 16px;
      font-weight: 900;
      margin-top: 4px;
      box-shadow: 0 6px 20px rgba(166,255,127,.14);
    }

    .publish-btn:active {
      transform: scale(.985);
    }

    .publish-btn:disabled {
      opacity: .55;
      cursor: not-allowed;
    }

    /* STATUS */

    .status {
      display: none;
      padding: 13px;
      border-radius: 14px;
      margin-bottom: 14px;
      font-size: 13px;
      font-weight: 750;
      border: 1px solid var(--px-border);
      background: var(--px-card);
    }

    .status.show {
      display: block;
    }

    .status.success {
      border-color: var(--px-lime);
      color: var(--px-lime);
    }

    .status.error {
      border-color: var(--px-danger);
      color: #ff9ca7;
    }

    /* QUICK LINKS */

    .quick-links {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 9px;
      margin-top: 5px;
    }

    .quick-link {
      min-height: 48px;
      border: 1px solid var(--px-border);
      border-radius: 14px;
      background: var(--px-card);
      color: var(--px-text);
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      font-weight: 800;
      font-size: 13px;
    }

    .quick-link:hover {
      border-color: var(--px-lime);
    }

    /* BOTTOM NAV */

    .bottom-nav {
      position: fixed;
      z-index: 100;
      left: 0;
      right: 0;
      bottom: 0;
      height: 76px;
      padding:
        8px
        max(8px, env(safe-area-inset-right))
        max(8px, env(safe-area-inset-bottom))
        max(8px, env(safe-area-inset-left));
      background: rgba(0,0,0,.96);
      border-top: 1px solid var(--px-border);
      display: flex;
      justify-content: center;
    }

    .nav-inner {
      width: 100%;
      max-width: 760px;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 4px;
    }

    .nav-item {
      min-height: 56px;
      border-radius: 14px;
      color: var(--px-muted);
      text-decoration: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      font-size: 11px;
      font-weight: 800;
    }

    .nav-icon {
      font-size: 19px;
      line-height: 1;
    }

    .nav-item.active {
      color: var(--px-lime);
      background: #111416;
    }

    /* MOBILE */

    @media (max-width: 420px) {
      .app {
        padding-left: 11px;
        padding-right: 11px;
      }

      .type-grid {
        gap: 6px;
      }

      .type-btn {
        min-height: 88px;
      }

      .type-btn small {
        font-size: 9px;
      }

      .platforms {
        gap: 5px;
      }

      .platform {
        font-size: 11px;
      }

      .price-row {
        grid-template-columns: 95px 1fr;
      }
    }
  </style>
</head>

<body>

  <main class="app">

    <!-- HEADER -->
    <header class="topbar">

      <a class="brand" href="feed.html">
        <img
          class="brand-logo"
          src="assets/icons/icon-192.png"
          alt="PostX"
          onerror="this.style.display='none'"
        >

        <div>
          <div class="brand-name">PostX</div>
          <div class="brand-sub">Create everywhere</div>
        </div>
      </a>

      <div class="header-actions">
        <a
          class="icon-btn"
          href="inbox.html"
          aria-label="Inbox"
        >💬</a>

        <a
          class="icon-btn"
          href="settings.html"
          aria-label="Settings"
        >⚙️</a>
      </div>

    </header>


    <!-- HERO -->
    <section class="hero">
      <h1>Create. <span>Connect.</span> Grow.</h1>
      <p>
        Share a post, sell something, or create a video story from one place.
      </p>
    </section>


    <!-- CREATE TYPE -->
    <section class="type-grid">

      <button
        class="type-btn active"
        data-type="post"
        type="button"
      >
        <span class="icon">✍️</span>
        <strong>Post</strong>
        <small>Social post</small>
      </button>

      <button
        class="type-btn"
        data-type="market"
        type="button"
      >
        <span class="icon">🛍️</span>
        <strong>Market</strong>
        <small>Sell anything</small>
      </button>

      <button
        class="type-btn"
        data-type="story"
        type="button"
      >
        <span class="icon">🎥</span>
        <strong>Story</strong>
        <small>Video story</small>
      </button>

    </section>


    <!-- STATUS -->
    <div
      id="status"
      class="status"
      role="status"
      aria-live="polite"
    ></div>


    <!-- CREATE CARD -->
    <section class="card">

      <div class="user-row">
        <div class="avatar">J</div>

        <div>
          <div class="user-name">Joseph Mbui</div>
          <div class="user-label" id="typeLabel">
            Creating a Post
          </div>
        </div>
      </div>


      <!-- CAPTION -->
      <div class="field">
        <label
          class="field-label"
          for="caption"
        >
          What's happening?
        </label>

        <textarea
          id="caption"
          maxlength="2000"
          placeholder="Share something with your community..."
        ></textarea>
      </div>


      <!-- MEDIA -->
      <div class="media-box">

        <label for="mediaInput">

          <span class="media-icon">📷</span>

          <span class="media-main">
            Add photo or video
          </span>

          <span class="media-sub">
            Tap to choose media from your phone
          </span>

        </label>

        <input
          id="mediaInput"
          type="file"
          accept="image/*,video/*"
        >

      </div>


      <!-- PREVIEW -->
      <div
        id="preview"
        class="preview"
      ></div>


      <!-- MARKET FIELDS -->
      <div id="marketFields" style="display:none;">

        <div class="field">

          <label
            class="field-label"
            for="marketTitle"
          >
            Product / Service name
          </label>

          <input
            id="marketTitle"
            type="text"
            maxlength="120"
            placeholder="e.g. Braids, Laptop, Electrical repair"
          >

        </div>


        <div class="field">

          <label class="field-label">
            Price
          </label>

          <div class="price-row">

            <select id="currency">
              <option value="KES">KES</option>
            </select>

            <input
              id="price"
              type="number"
              min="0"
              step="1"
              placeholder="Enter price"
            >

          </div>

        </div>


        <div class="field">

          <label
            class="field-label"
            for="location"
          >
            Location
          </label>

          <input
            id="location"
            type="text"
            maxlength="100"
            placeholder="e.g. Mariakani, Kilifi"
          >

        </div>

      </div>


      <!-- PLATFORM -->
      <div class="field">

        <label class="field-label">
          Publish to
        </label>

        <div class="platforms">

          <label class="platform">
            <input
              type="checkbox"
              id="postx"
              checked
            >
            PostX
          </label>

          <label class="platform">
            <input
              type="checkbox"
              id="facebook"
            >
            Facebook
          </label>

          <label class="platform">
            <input
              type="checkbox"
              id="instagram"
            >
            Instagram
          </label>

        </div>

      </div>


      <!-- BOOST -->
      <div class="field">

        <label class="boost-box">

          <input
            type="checkbox"
            id="boost"
          >

          <span>

            <span class="boost-title">
              🚀 Boost this post
            </span>

            <span class="boost-description">
              Reach more people and increase visibility.
            </span>

            <span class="boost-price">
              Everyday Boost — KSh 10
            </span>

          </span>

        </label>

      </div>


      <!-- PUBLISH -->
      <div class="field">

        <button
          id="publishBtn"
          class="publish-btn"
          type="button"
        >
          Publish on PostX
        </button>

      </div>

    </section>


    <!-- QUICK LINKS -->
    <section class="quick-links">

      <a
        class="quick-link"
        href="feed.html"
      >
        🏠 View Feed
      </a>

      <a
        class="quick-link"
        href="catalog.html"
      >
        🛍️ Marketplace
      </a>

      <a
        class="quick-link"
        href="inbox.html"
      >
        💬 Inbox
      </a>

      <a
        class="quick-link"
        href="settings.html"
      >
        ⚙️ Settings
      </a>

    </section>

  </main>


  <!-- BOTTOM NAV -->
  <nav class="bottom-nav">

    <div class="nav-inner">

      <a
        class="nav-item active"
        href="index.html"
      >
        <span class="nav-icon">＋</span>
        Create
      </a>

      <a
        class="nav-item"
        href="feed.html"
      >
        <span class="nav-icon">⌂</span>
        Home
      </a>

      <a
        class="nav-item"
        href="catalog.html"
      >
        <span class="nav-icon">🛍</span>
        Market
      </a>

      <a
        class="nav-item"
        href="inbox.html"
      >
        <span class="nav-icon">💬</span>
        Inbox
      </a>

      <a
        class="nav-item"
        href="settings.html"
      >
        <span class="nav-icon">◉</span>
        Profile
      </a>

    </div>

  </nav>


  <script>
    (() => {

      const typeButtons =
        document.querySelectorAll(".type-btn");

      const marketFields =
        document.getElementById("marketFields");

      const caption =
        document.getElementById("caption");

      const marketTitle =
        document.getElementById("marketTitle");

      const price =
        document.getElementById("price");

      const locationInput =
        document.getElementById("location");

      const typeLabel =
        document.getElementById("typeLabel");

      const publishBtn =
        document.getElementById("publishBtn");

      const status =
        document.getElementById("status");

      const mediaInput =
        document.getElementById("mediaInput");

      const preview =
        document.getElementById("preview");

      const boost =
        document.getElementById("boost");

      let currentType = "post";


      /* TYPE SWITCH */

      function updateType(type) {

        currentType = type;

        typeButtons.forEach(btn => {
          btn.classList.toggle(
            "active",
            btn.dataset.type === type
          );
        });

        if (type === "post") {

          typeLabel.textContent =
            "Creating a Post";

          caption.placeholder =
            "Share something with your community...";

          publishBtn.textContent =
            "Publish on PostX";

          marketFields.style.display =
            "none";

          mediaInput.accept =
            "image/*,video/*";

        }

        if (type === "market") {

          typeLabel.textContent =
            "Creating a Marketplace Listing";

          caption.placeholder =
            "Describe your product or service...";

          publishBtn.textContent =
            "Publish Listing";

          marketFields.style.display =
            "block";

          mediaInput.accept =
            "image/*,video/*";

        }

        if (type === "story") {

          typeLabel.textContent =
            "Creating a Video Story";

          caption.placeholder =
            "Add a caption to your story...";

          publishBtn.textContent =
            "Publish Story";

          marketFields.style.display =
            "none";

          mediaInput.accept =
            "video/*";

        }

      }


      typeButtons.forEach(btn => {

        btn.addEventListener(
          "click",
          () => updateType(btn.dataset.type)
        );

      });


      /* MEDIA PREVIEW */

      mediaInput.addEventListener(
        "change",
        () => {

          const file =
            mediaInput.files[0];

          preview.innerHTML = "";

          if (!file) {

            preview.style.display =
              "none";

            return;
          }

          const url =
            URL.createObjectURL(file);

          if (file.type.startsWith("image/")) {

            const img =
              document.createElement("img");

            img.src = url;
            img.alt = "Selected media";

            preview.appendChild(img);

          } else if (
            file.type.startsWith("video/")
          ) {

            const video =
              document.createElement("video");

            video.src = url;
            video.controls = true;
            video.playsInline = true;

            preview.appendChild(video);

          }

          preview.style.display =
            "block";

        }
      );


      /* STATUS */

      function showStatus(
        message,
        type = "success"
      ) {

        status.textContent =
          message;

        status.className =
          "status show " + type;

        window.scrollTo({
          top: 0,
          behavior: "smooth"
        });

      }


      /* PUBLISH */

      publishBtn.addEventListener(
        "click",
        () => {

          const text =
            caption.value.trim();

          const selectedMedia =
            mediaInput.files[0];

          const postx =
            document.getElementById(
              "postx"
            ).checked;

          const facebook =
            document.getElementById(
              "facebook"
            ).checked;

          const instagram =
            document.getElementById(
              "instagram"
            ).checked;


          if (!text && !selectedMedia) {

            showStatus(
              "Add a caption, photo or video before publishing.",
              "error"
            );

            return;
          }


          if (!postx && !facebook && !instagram) {

            showStatus(
              "Select at least one platform.",
              "error"
            );

            return;
          }


          if (
            currentType === "story" &&
            !selectedMedia
          ) {

            showStatus(
              "A video is required for a story.",
              "error"
            );

            return;
          }


          if (
            currentType === "market" &&
            !marketTitle.value.trim()
          ) {

            showStatus(
              "Enter a product or service name.",
              "error"
            );

            return;
          }


          if (
            currentType === "market" &&
            price.value &&
            Number(price.value) < 0
          ) {

            showStatus(
              "Enter a valid price.",
              "error"
            );

            return;
          }


          const post = {

            id:
              "px_" +
              Date.now() +
              "_" +
              Math.random()
                .toString(36)
                .slice(2, 8),

            type:
              currentType,

            text:
              text,

            title:
              marketTitle.value.trim(),

            price:
              price.value
                ? Number(price.value)
                : 0,

            currency:
              "KES",

            location:
              locationInput.value.trim(),

            platforms: {
              postx,
              facebook,
              instagram
            },

            boosted:
              boost.checked,

            boostPrice:
              boost.checked
                ? 10
                : 0,

            likes: 0,

            comments: 0,

            views: 0,

            profileViews: 0,

            createdAt:
              new Date().toISOString()

          };


          /*
           * Local MVP storage.
           * Backend/API publishing can replace this
           * later without changing the UI.
           */

          const storageKey =
            "postx_social_feed_v1";

          let posts = [];

          try {

            posts =
              JSON.parse(
                localStorage.getItem(
                  storageKey
                ) || "[]"
              );

          } catch (error) {

            posts = [];

          }


          posts.unshift(post);


          localStorage.setItem(
            storageKey,
            JSON.stringify(posts)
          );


          /*
           * Save the selected file reference
           * for this browser session only.
           */

          if (selectedMedia) {

            try {

              sessionStorage.setItem(
                "postx_last_media_name",
                selectedMedia.name
              );

            } catch (error) {}

          }


          showStatus(
            currentType === "market"
              ? "Listing published successfully."
              : currentType === "story"
                ? "Story published successfully."
                : "Post published successfully.",
            "success"
          );


          /* RESET */

          caption.value = "";
          marketTitle.value = "";
          price.value = "";
          locationInput.value = "";
          mediaInput.value = "";
          boost.checked = false;

          preview.innerHTML = "";
          preview.style.display = "none";


          /*
           * Give the user a moment to see
           * the success message, then open feed.
           */

          setTimeout(() => {

            window.location.href =
              "feed.html";

          }, 700);

        }
      );


      /* INITIAL STATE */

      updateType("post");

    })();
  </script>

</body>
</html>
