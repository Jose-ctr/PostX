<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1, viewport-fit=cover"
>

<meta name="theme-color" content="#07111f">

<title>PostX — Social Hub</title>

<style>

/* =====================================================
   POSTX SOCIAL HUB — ANDROID OPTIMIZED
   ===================================================== */

:root{
  --bg:#050b13;
  --surface:#0b1624;
  --surface2:#0f1e2f;
  --border:#1b3448;

  --cyan:#00d9ff;
  --text:#f4f8fb;
  --muted:#9bb0bf;

  --danger:#ff5577;
  --green:#3ee58a;
}


/* =====================================================
   RESET
   ===================================================== */

*{
  box-sizing:border-box;
  margin:0;
  padding:0;

  font-family:
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Roboto,
    Arial,
    sans-serif;
}

html{
  background:var(--bg);
  scroll-behavior:smooth;
}

body{
  background:
    radial-gradient(
      circle at 50% -10%,
      #12334a 0%,
      transparent 38%
    ),
    var(--bg);

  color:var(--text);

  min-height:100vh;

  overflow-x:hidden;

  padding-bottom:105px;

  -webkit-text-size-adjust:100%;
}

button,
input,
textarea{
  font:inherit;
}

button{
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}

a{
  -webkit-tap-highlight-color:transparent;
}


/* =====================================================
   APP
   ===================================================== */

.app{
  width:100%;
  max-width:720px;
  margin:auto;
}


/* =====================================================
   HEADER
   ===================================================== */

.topbar{
  position:sticky;
  top:0;
  z-index:50;

  display:flex;
  justify-content:space-between;
  align-items:center;

  padding:
    calc(10px + env(safe-area-inset-top))
    16px
    12px;

  background:rgba(5,11,19,.92);

  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);

  border-bottom:
    1px solid rgba(0,217,255,.08);
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
}

.brand img{
  width:43px;
  height:43px;

  border-radius:12px;

  object-fit:cover;
}

.brand strong{
  display:block;

  font-size:19px;
  font-weight:800;

  letter-spacing:.1px;
}

.brand small{
  display:block;

  color:var(--muted);

  font-size:12px;

  margin-top:2px;
}

.header-actions{
  display:flex;
  gap:8px;
}

.icon-btn,
.avatar-btn{
  width:42px;
  height:42px;

  border-radius:50%;

  border:1px solid var(--border);

  background:var(--surface);

  color:white;

  display:grid;
  place-items:center;
}

.icon-btn{
  font-size:18px;
}

.avatar-btn{
  background:
    linear-gradient(
      135deg,
      #00d9ff,
      #1687ff
    );

  color:#001018;

  font-size:15px;
  font-weight:900;
}


/* =====================================================
   CONTENT
   ===================================================== */

.content{
  padding:17px 16px 24px;
}


/* =====================================================
   HERO
   ===================================================== */

.hero{
  padding:8px 2px 18px;
}

.eyebrow{
  color:var(--cyan);

  font-size:11px;
  font-weight:900;

  letter-spacing:1.8px;
}

.hero h1{
  font-size:29px;
  line-height:1.15;

  margin-top:5px;

  font-weight:800;
}

.hero p{
  color:var(--muted);

  font-size:14px;
  line-height:1.5;

  margin-top:6px;
}


/* =====================================================
   PROFILE VIEWS
   ===================================================== */

.profile-card{
  background:
    linear-gradient(
      145deg,
      rgba(15,30,47,.98),
      rgba(8,19,31,.98)
    );

  border:1px solid var(--border);

  border-radius:17px;

  padding:15px;

  margin-bottom:17px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  gap:12px;
}

.profile-left{
  display:flex;
  align-items:center;
  gap:11px;

  min-width:0;
}

.profile-number{
  font-size:20px;
  line-height:1;

  font-weight:900;
}

.profile-label{
  color:var(--muted);

  font-size:12px;

  margin-top:4px;
}

.profile-card .filter{
  padding:9px 13px;

  font-size:12px;

  white-space:nowrap;
}


/* =====================================================
   AVATARS
   ===================================================== */

.author-avatar{
  width:43px;
  height:43px;

  border-radius:50%;

  display:grid;
  place-items:center;

  background:
    linear-gradient(
      135deg,
      #00d9ff,
      #1687ff
    );

  color:#001018;

  font-size:15px;
  font-weight:900;

  flex:0 0 auto;
}


/* =====================================================
   FILTERS
   ===================================================== */

.filters{
  display:flex;
  gap:8px;

  overflow-x:auto;

  padding-bottom:13px;

  scrollbar-width:none;

  -webkit-overflow-scrolling:touch;
}

.filters::-webkit-scrollbar{
  display:none;
}

.filter{
  flex:0 0 auto;

  border:1px solid var(--border);

  background:var(--surface);

  color:var(--muted);

  border-radius:999px;

  padding:9px 15px;

  font-size:13px;
  line-height:1;

  font-weight:700;

  min-height:36px;
}

.filter.active{
  color:#001018;

  background:var(--cyan);

  border-color:var(--cyan);
}


/* =====================================================
   POST CARD
   ===================================================== */

.post{
  background:
    linear-gradient(
      145deg,
      rgba(15,30,47,.98),
      rgba(8,19,31,.98)
    );

  border:1px solid var(--border);

  border-radius:18px;

  margin-bottom:16px;

  overflow:hidden;

  box-shadow:
    0 12px 35px rgba(0,0,0,.22);
}


/* =====================================================
   POST HEADER
   ===================================================== */

.post-head{
  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:15px;
}

.author{
  display:flex;
  align-items:center;
  gap:10px;

  min-width:0;

  cursor:pointer;
}

.author-info{
  min-width:0;
}

.author-info strong{
  display:block;

  font-size:15px;
  line-height:1.25;

  font-weight:750;

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.author-info small{
  display:block;

  color:var(--muted);

  font-size:12px;
  line-height:1.3;

  margin-top:3px;
}

.more{
  border:0;
  background:none;

  color:var(--muted);

  font-size:23px;

  padding:5px 3px;

  line-height:1;
}


/* =====================================================
   MEDIA
   ===================================================== */

.post-media{
  width:100%;

  aspect-ratio:16/10;

  background:
    linear-gradient(
      135deg,
      #102f42,
      #07131e
    );

  display:grid;
  place-items:center;

  color:var(--cyan);

  font-size:55px;
}

.post-media img,
.post-media video{
  width:100%;
  height:100%;

  object-fit:cover;
}


/* =====================================================
   POST CONTENT
   ===================================================== */

.post-body{
  padding:15px;
}

.post-text{
  font-size:16px;

  line-height:1.6;

  white-space:pre-wrap;

  overflow-wrap:anywhere;
}

.post-location{
  color:var(--muted);

  font-size:12px;

  margin-top:9px;
}

.post-tags{
  color:var(--cyan);

  font-size:13px;

  line-height:1.4;

  margin-top:8px;
}

.sponsored{
  display:inline-flex;
  align-items:center;

  gap:5px;

  color:#ffd66b;

  font-size:11px;

  font-weight:800;

  margin-top:8px;
}


/* =====================================================
   METRICS
   ===================================================== */

.metrics{
  display:flex;
  justify-content:space-between;
  align-items:center;

  gap:8px;

  padding:0 15px 11px;

  color:var(--muted);

  font-size:12px;

  line-height:1.3;
}

.metrics span{
  white-space:nowrap;
}


/* =====================================================
   ACTIONS
   ===================================================== */

.actions{
  display:grid;

  grid-template-columns:
    repeat(4,1fr);

  border-top:
    1px solid rgba(255,255,255,.06);
}

.action{
  border:0;

  background:none;

  color:var(--muted);

  padding:12px 4px 13px;

  font-size:13px;

  line-height:1.2;

  font-weight:700;

  min-height:62px;
}

.action span{
  display:block;

  font-size:20px;

  line-height:22px;

  margin-bottom:4px;
}

.action.liked{
  color:var(--danger);
}

.action:hover{
  background:
    rgba(0,217,255,.04);
}

.action:active{
  transform:scale(.97);
}


/* =====================================================
   COMMENTS
   ===================================================== */

.comments{
  display:none;

  padding:13px 15px 15px;

  border-top:
    1px solid rgba(255,255,255,.06);
}

.comments.open{
  display:block;
}

.comment-list{
  display:flex;
  flex-direction:column;

  gap:11px;

  margin-bottom:11px;
}

.comment{
  display:flex;

  gap:9px;

  align-items:flex-start;
}

.comment-avatar{
  width:31px;
  height:31px;

  border-radius:50%;

  background:#17364b;

  display:grid;
  place-items:center;

  color:var(--cyan);

  font-size:12px;

  font-weight:800;

  flex:0 0 auto;
}

.comment-content{
  background:#0b1724;

  border-radius:11px;

  padding:8px 10px;

  flex:1;

  min-width:0;
}

.comment-content strong{
  font-size:12px;
}

.comment-content p{
  color:#dce6ec;

  font-size:13px;

  line-height:1.45;

  margin-top:3px;

  overflow-wrap:anywhere;
}

.comment-form{
  display:flex;

  gap:8px;
}

.comment-form input{
  flex:1;

  min-width:0;

  background:#07111c;

  border:1px solid var(--border);

  border-radius:11px;

  color:white;

  padding:11px 12px;

  font-size:14px;

  outline:none;

  min-height:43px;
}

.comment-form input:focus{
  border-color:var(--cyan);

  box-shadow:
    0 0 0 2px rgba(0,217,255,.08);
}

.comment-form button{
  border:0;

  border-radius:11px;

  background:var(--cyan);

  color:#001018;

  padding:0 14px;

  min-height:43px;

  font-size:13px;

  font-weight:900;
}


/* =====================================================
   EMPTY STATE
   ===================================================== */

.empty{
  text-align:center;

  padding:55px 20px;

  color:var(--muted);

  font-size:14px;

  line-height:1.5;
}

.empty strong{
  display:block;

  color:white;

  font-size:16px;

  margin-bottom:6px;
}


/* =====================================================
   BOTTOM NAVIGATION
   ===================================================== */

.bottom-nav{
  position:fixed;

  left:0;
  right:0;
  bottom:0;

  z-index:100;

  display:grid;

  grid-template-columns:
    repeat(5,1fr);

  padding:
    8px
    6px
    calc(8px + env(safe-area-inset-bottom));

  background:
    rgba(6,13,21,.97);

  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);

  border-top:1px solid var(--border);
}

.nav-item{
  border:0;

  background:none;

  color:#8499a7;

  text-decoration:none;

  text-align:center;

  padding:7px 2px;

  border-radius:12px;

  font-size:11px;

  line-height:1.2;

  font-weight:650;

  min-height:52px;
}

.nav-item span{
  display:block;

  font-size:21px;

  line-height:22px;

  margin-bottom:3px;
}

.nav-item.active{
  color:var(--cyan);

  background:
    rgba(0,217,255,.08);
}

.nav-item:active{
  transform:scale(.96);
}


/* =====================================================
   ANDROID SMALL SCREENS
   ===================================================== */

@media(max-width:360px){

  .content{
    padding-left:13px;
    padding-right:13px;
  }

  .hero h1{
    font-size:27px;
  }

  .post-text{
    font-size:15px;
  }

  .metrics{
    font-size:11px;
  }

  .action{
    font-size:12px;
  }

  .nav-item{
    font-size:10px;
  }

}


/* =====================================================
   TABLET / DESKTOP
   ===================================================== */

@media(min-width:700px){

  .content{
    padding:
      22px
      0
      30px;
  }

  .topbar{
    border-radius:0;
  }

}

</style>
</head>


<body>

<div class="app">


<!-- =====================================================
     HEADER
     ===================================================== -->

<header class="topbar">

  <div class="brand">

    <img
      src="assets/icons/icon-192.png"
      alt="PostX"
    >

    <div>

      <strong>PostX</strong>

      <small>
        Social Hub
      </small>

    </div>

  </div>


  <div class="header-actions">

    <button
      class="icon-btn"
      type="button"
      onclick="showNotice('Notifications coming soon')"
      aria-label="Notifications"
    >
      🔔
    </button>


    <button
      class="avatar-btn"
      type="button"
      onclick="openMyProfile()"
      aria-label="Profile"
    >
      J
    </button>

  </div>

</header>


<!-- =====================================================
     CONTENT
     ===================================================== -->

<main class="content">


<section class="hero">

  <div class="eyebrow">
    POSTX SOCIAL
  </div>

  <h1>
    Discover
  </h1>

  <p>
    Connect, discover and engage with people and businesses.
  </p>

</section>


<!-- =====================================================
     PROFILE VIEWS
     ===================================================== -->

<div class="profile-card">

  <div class="profile-left">

    <div class="author-avatar">
      J
    </div>

    <div>

      <div
        class="profile-number"
        id="profileViews"
      >
        0
      </div>

      <div class="profile-label">
        Profile views
      </div>

    </div>

  </div>


  <button
    class="filter"
    onclick="openMyProfile()"
  >
    View profile
  </button>

</div>


<!-- =====================================================
     FILTERS
     ===================================================== -->

<div class="filters">

  <button
    class="filter active"
    data-filter="all"
  >
    All
  </button>

  <button
    class="filter"
    data-filter="postx"
  >
    PostX
  </button>

  <button
    class="filter"
    data-filter="business"
  >
    Business
  </button>

  <button
    class="filter"
    data-filter="following"
  >
    Following
  </button>

</div>


<!-- =====================================================
     FEED
     ===================================================== -->

<section id="feed"></section>


</main>


<!-- =====================================================
     BOTTOM NAVIGATION
     ===================================================== -->

<nav class="bottom-nav">

  <a
    class="nav-item"
    href="index.html"
  >
    <span>＋</span>
    Create
  </a>


  <a
    class="nav-item active"
    href="feed.html"
  >
    <span>⌂</span>
    Social
  </a>


  <a
    class="nav-item"
    href="marketplace.html"
  >
    <span>🏪</span>
    Market
  </a>


  <a
    class="nav-item"
    href="inbox.html"
  >
    <span>💬</span>
    Inbox
  </a>


  <a
    class="nav-item"
    href="settings.html"
  >
    <span>⚙</span>
    Settings
  </a>

</nav>


</div>


<script>

/* =====================================================
   POSTX SOCIAL ENGINE
   Frontend MVP persistence
   ===================================================== */

const STORAGE_KEY =
  "postx_social_data_v1";


const CURRENT_USER = {

  id:
    "current-user",

  name:
    "Joseph",

  avatar:
    "J"

};


/* =====================================================
   DEFAULT DATA
   ===================================================== */

const DEFAULT_DATA = {

  profileViews:0,

  posts:[

    {

      id:"demo-1",

      authorId:"business-1",

      author:"PostX Demo Store",

      avatar:"P",

      type:"business",

      text:
        "Welcome to PostX. Create once, publish everywhere and connect with customers.",

      location:"Mariakani",

      tags:"#PostX #Kenya",

      likes:0,

      liked:false,

      views:0,

      comments:[]

    },


    {

      id:"demo-2",

      authorId:"user-2",

      author:"PostX Creator",

      avatar:"C",

      type:"postx",

      text:
        "Your first PostX post is free. Share something with the community.",

      location:"Kilifi",

      tags:"#PostX #Kilifi",

      likes:0,

      liked:false,

      views:0,

      comments:[]

    }

  ]

};


/* =====================================================
   LOAD DATA
   ===================================================== */

function loadData(){

  try{

    const saved =
      localStorage.getItem(
        STORAGE_KEY
      );

    if(saved){

      const parsed =
        JSON.parse(saved);

      return {

        ...DEFAULT_DATA,

        ...parsed

      };

    }

  }catch(error){

    console.error(
      "PostX storage error:",
      error
    );

  }

  return structuredClone(
    DEFAULT_DATA
  );

}


/* =====================================================
   SAVE DATA
   ===================================================== */

function saveData(){

  localStorage.setItem(

    STORAGE_KEY,

    JSON.stringify(data)

  );

}


/* =====================================================
   DATA
   ===================================================== */

let data =
  loadData();


/* =====================================================
   PROFILE VIEWS
   ===================================================== */

function renderProfileViews(){

  const element =
    document.getElementById(
      "profileViews"
    );

  if(!element)
    return;

  element.textContent =
    data.profileViews || 0;

}


/* =====================================================
   ESCAPE HTML
   ===================================================== */

function escapeHTML(value){

  return String(value)

    .replaceAll(
      "&",
      "&amp;"
    )

    .replaceAll(
      "<",
      "&lt;"
    )

    .replaceAll(
      ">",
      "&gt;"
    )

    .replaceAll(
      '"',
      "&quot;"
    )

    .replaceAll(
      "'",
      "&#039;"
    );

}


/* =====================================================
   FEED FILTER
   ===================================================== */

let activeFilter =
  "all";


/* =====================================================
   RENDER FEED
   ===================================================== */

function renderFeed(){

  const feed =
    document.getElementById(
      "feed"
    );

  if(!feed)
    return;


  let posts =
    data.posts || [];


  if(activeFilter !== "all"){

    posts =
      posts.filter(
        post =>
          post.type ===
          activeFilter
      );

  }


  if(!posts.length){

    feed.innerHTML = `

      <div class="empty">

        <strong>
          No posts here yet
        </strong>

        Try another filter or create
        a new post.

      </div>

    `;

    return;

  }


  feed.innerHTML =
    posts
      .map(renderPost)
      .join("");

}


/* =====================================================
   POST HTML
   ===================================================== */

function renderPost(post){

  const comments =
    post.comments || [];


  return `

<article
  class="post"
  data-post-id="${escapeHTML(post.id)}"
>


  <div class="post-head">


    <div
      class="author"
      onclick="viewProfile('${escapeHTML(post.authorId)}')"
    >

      <div class="author-avatar">
        ${escapeHTML(post.avatar || "?")}
      </div>


      <div class="author-info">

        <strong>
          ${escapeHTML(post.author)}
        </strong>

        <small>
          PostX ·
          ${escapeHTML(
            post.location || "Kenya"
          )}
        </small>

      </div>

    </div>


    <button
      class="more"
      type="button"
      onclick="showNotice('Post options coming soon')"
      aria-label="Post options"
    >
      ⋯
    </button>

  </div>


  <div class="post-media">
    ✦
  </div>


  <div class="post-body">


    <div class="post-text">
      ${escapeHTML(
        post.text || ""
      )}
    </div>


    ${
      post.location
      ?
      `
      <div class="post-location">
        📍
        ${escapeHTML(post.location)}
      </div>
      `
      :
      ""
    }


    ${
      post.tags
      ?
      `
      <div class="post-tags">
        ${escapeHTML(post.tags)}
      </div>
      `
      :
      ""
    }


    ${
      post.boosted
      ?
      `
      <div class="sponsored">
        🚀 Sponsored
      </div>
      `
      :
      ""
    }


  </div>


  <div class="metrics">

    <span>
      ❤️ ${post.likes || 0} likes
    </span>

    <span>
      💬 ${comments.length} comments
    </span>

    <span>
      👁 ${post.views || 0} views
    </span>

  </div>


  <div class="actions">


    <button
      class="action ${post.liked ? "liked" : ""}"
      type="button"
      onclick="toggleLike('${escapeHTML(post.id)}')"
    >

      <span>
        ${post.liked ? "❤️" : "♡"}
      </span>

      Like

    </button>


    <button
      class="action"
      type="button"
      onclick="toggleComments('${escapeHTML(post.id)}')"
    >

      <span>
        💬
      </span>

      Comment

    </button>


    <button
      class="action"
      type="button"
      onclick="sharePost('${escapeHTML(post.id)}')"
    >

      <span>
        ↗
      </span>

      Share

    </button>


    <button
      class="action"
      type="button"
      onclick="openPost('${escapeHTML(post.id)}')"
    >

      <span>
        👁
      </span>

      View

    </button>


  </div>


  <div
    class="comments"
    id="comments-${escapeHTML(post.id)}"
  >


    <div class="comment-list">

      ${
        comments.length
        ?
        comments
          .map(
            comment => `

<div class="comment">

  <div class="comment-avatar">
    ${escapeHTML(
      comment.avatar || "U"
    )}
  </div>


  <div class="comment-content">

    <strong>
      ${escapeHTML(
        comment.name
      )}
    </strong>

    <p>
      ${escapeHTML(
        comment.text
      )}
    </p>

  </div>

</div>

            `
          )
          .join("")
        :
        `
        <small style="color:#8499a7">
          No comments yet. Be the first.
        </small>
        `
      }

    </div>


    <form
      class="comment-form"
      onsubmit="addComment(event,'${escapeHTML(post.id)}')"
    >

      <input
        id="comment-input-${escapeHTML(post.id)}"
        placeholder="Write a comment..."
        maxlength="500"
        autocomplete="off"
      >

      <button type="submit">
        Send
      </button>

    </form>


  </div>


</article>

`;

}


/* =====================================================
   LIKE
   ===================================================== */

function toggleLike(postId){

  const post =
    data.posts.find(
      item =>
        item.id === postId
    );

  if(!post)
    return;


  if(post.liked){

    post.likes =
      Math.max(
        0,
        (post.likes || 0) - 1
      );

    post.liked =
      false;

  }else{

    post.likes =
      (post.likes || 0) + 1;

    post.liked =
      true;

  }


  saveData();

  renderFeed();

}


/* =====================================================
   COMMENTS
   ===================================================== */

function toggleComments(postId){

  const element =
    document.getElementById(
      "comments-" + postId
    );

  if(!element)
    return;


  element.classList.toggle(
    "open"
  );

}


/* =====================================================
   ADD COMMENT
   ===================================================== */

function addComment(
  event,
  postId
){

  event.preventDefault();


  const input =
    document.getElementById(
      "comment-input-" +
      postId
    );

  if(!input)
    return;


  const text =
    input.value.trim();


  if(!text)
    return;


  const post =
    data.posts.find(
      item =>
        item.id === postId
    );


  if(!post)
    return;


  if(!post.comments){

    post.comments = [];

  }


  post.comments.push({

    id:
      Date.now().toString(),

    userId:
      CURRENT_USER.id,

    name:
      CURRENT_USER.name,

    avatar:
      CURRENT_USER.avatar,

    text:
      text,

    createdAt:
      new Date().toISOString()

  });


  saveData();

  renderFeed();


  setTimeout(() => {

    const box =
      document.getElementById(
        "comments-" +
        postId
      );

    if(box){

      box.classList.add(
        "open"
      );

    }

  },0);

}


/* =====================================================
   OPEN POST / VIEWS
   ===================================================== */

function openPost(postId){

  const post =
    data.posts.find(
      item =>
        item.id === postId
    );

  if(!post)
    return;


  post.views =
    (post.views || 0) + 1;


  saveData();

  renderFeed();


  showNotice(
    "Post viewed"
  );

}


/* =====================================================
   PROFILE VIEW
   ===================================================== */

function viewProfile(userId){

  if(
    userId ===
    CURRENT_USER.id
  ){

    openMyProfile();

    return;

  }


  data.profileViews =
    (data.profileViews || 0) + 1;


  saveData();

  renderProfileViews();


  showNotice(
    "Profile viewed"
  );

}


/* =====================================================
   MY PROFILE
   ===================================================== */

function openMyProfile(){

  showNotice(

  );

}


/* =====================================================
   SHARE
   ===================================================== */

async function sharePost(postId){

  const post =
    data.posts.find(
      item =>
        item.id === postId
    );

  if(!post)
    return;


  const shareData = {

    title:
      "PostX",

    text:
      post.text ||
      "Check this PostX post",

    url:
      window.location.href +
      "#post-" +
      postId

  };


  try{

    if(
      navigator.share
    ){

      await navigator.share(
        shareData
      );

    }else{

      await navigator.clipboard.writeText(
        shareData.url
      );

      showNotice(
        "Post link copied"
      );

    }

  }catch(error){

    /* User cancelled share */

  }

}

function showNotice(message){

  let toast =
    document.getElementById(
      "postxToast"
    );


  if(!toast){

    toast =
      document.createElement(
        "div"
      );


    toast.id =
      "postxToast";


    toast.style.cssText = `

      position:fixed;

      left:50%;
      bottom:92px;

      transform:
        translateX(-50%);

      background:#102334;

      color:#fff;

      border:
        1px solid #00d9ff;

      padding:
        12px 17px;

      border-radius:
        999px;

      font-size:13px;

      font-weight:700;

      z-index:300;

      box-shadow:
        0 8px 30px
        rgba(0,0,0,.4);

      max-width:
        calc(100vw - 32px);

      text-align:center;

      white-space:nowrap;

    `;


    document.body.appendChild(
      toast
    );

  }


  toast.textContent =
    message;


  toast.style.display =
    "block";


  clearTimeout(
    toast._timer
  );


  toast._timer =
    setTimeout(
      () => {

        toast.style.display =
          "none";

      },
      2200
    );

}


/* =====================================================
   WHOLE SCREEN SWIPE
   CREATE → SOCIAL → MARKETPLACE → INBOX → SETTINGS
   ===================================================== */

const POSTX_PAGES = [

  "index.html",

  "feed.html",

  "marketplace.html",

  "inbox.html",

  "settings.html"

];


let swipeStartX = 0;
let swipeStartY = 0;


document.addEventListener(
  "touchstart",
  event => {

    if(
      !event.touches.length
    )
      return;


    swipeStartX =
      event.touches[0].clientX;


    swipeStartY =
      event.touches[0].clientY;

  },
  {
    passive:true
  }
);


document.addEventListener(
  "touchend",
  event => {

    if(
      !event.changedTouches.length
    )
      return;


    const endX =
      event.changedTouches[0].clientX;


    const endY =
      event.changedTouches[0].clientY;


    const dx =
      endX -
      swipeStartX;


    const dy =
      endY -
      swipeStartY;


    if(

      Math.abs(dx) < 90 ||

      Math.abs(dy) > 100

    ){

      return;

    }


    let file =
      location.pathname
        .split("/")
        .pop()
        .toLowerCase();


    if(!file){

      file =
        "index.html";

    }


    let index =
      POSTX_PAGES.indexOf(
        file
      );


    if(index === -1){

      index = 0;

    }


    /* Swipe left */

    if(

      dx < -90 &&

      index <
      POSTX_PAGES.length - 1

    ){

      window.location.href =
        POSTX_PAGES[index + 1];

    }


    /* Swipe right */

    if(

      dx > 90 &&

      index > 0

    ){

      window.location.href =
        POSTX_PAGES[index - 1];

    }

  },
  {
    passive:true
  }
);
