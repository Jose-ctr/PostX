<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <meta name="theme-color" content="#000000">
  <meta
    name="description"
    content="PostX Marketplace — buy, sell and discover products and services."
  >

  <title>Marketplace • PostX</title>

  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="assets/icons/icon-192.png">

  <style>
    :root {
      --bg: #000000;
      --card: #212528;
      --surface: #4B4F52;
      --text: #FFFFFF;
      --muted: #D0D5D8;
      --border: #555B5E;
      --lime: #A6FF7F;
      --danger: #FF6B6B;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      min-height: 100vh;
      padding-bottom: 88px;
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .app {
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
    }

    /* HEADER */

    header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(0, 0, 0, 0.96);
      border-bottom: 1px solid var(--border);
      padding: 12px 14px;
    }

    .header-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo {
      color: var(--text);
      font-size: 22px;
      font-weight: 900;
      letter-spacing: -0.5px;
      white-space: nowrap;
    }

    .logo span {
      color: var(--lime);
    }

    .search {
      flex: 1;
      min-width: 0;
      height: 44px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: var(--card);
      color: var(--text);
      padding: 0 13px;
      outline: none;
      font-size: 15px;
    }

    .search:focus {
      border-color: var(--lime);
    }

    .header-btn {
      width: 44px;
      height: 44px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: var(--card);
      color: var(--text);
      font-size: 19px;
    }

    .header-btn:active {
      transform: scale(0.96);
    }

    /* HERO */

    .hero {
      padding: 22px 14px 12px;
    }

    .hero-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 20px;
    }

    .hero h1 {
      margin: 0 0 7px;
      font-size: 27px;
      line-height: 1.15;
    }

    .hero p {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
    }

    .hero-actions {
      display: flex;
      gap: 10px;
      margin-top: 17px;
      flex-wrap: wrap;
    }

    .primary-btn,
    .secondary-btn {
      min-height: 46px;
      border-radius: 14px;
      padding: 0 17px;
      font-weight: 800;
      border: 1px solid var(--border);
    }

    .primary-btn {
      background: var(--lime);
      color: #000;
      border-color: var(--lime);
    }

    .secondary-btn {
      background: var(--surface);
      color: var(--text);
    }

    /* NOTICE */

    .notice {
      margin: 10px 14px 0;
      padding: 14px;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: #16191B;
    }

    .notice strong {
      display: block;
      margin-bottom: 4px;
      font-size: 15px;
    }

    .notice span {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
    }

    /* CONTROLS */

    .controls {
      padding: 16px 14px 8px;
    }

    .tabs {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 8px;
      scrollbar-width: none;
    }

    .tabs::-webkit-scrollbar {
      display: none;
    }

    .tab {
      flex: 0 0 auto;
      min-height: 42px;
      padding: 0 15px;
      border-radius: 13px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--muted);
      font-weight: 800;
    }

    .tab.active {
      background: var(--lime);
      color: #000;
      border-color: var(--lime);
    }

    .filters {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 9px;
      margin-top: 4px;
    }

    select {
      height: 44px;
      width: 100%;
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 13px;
      padding: 0 11px;
      outline: none;
    }

    /* GRID */

    .content {
      padding: 10px 14px 30px;
    }

    .results-info {
      color: var(--muted);
      font-size: 13px;
      margin: 0 0 12px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 11px;
    }

    .listing {
      overflow: hidden;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      min-width: 0;
    }

    .listing-image {
      width: 100%;
      aspect-ratio: 1 / 0.82;
      object-fit: cover;
      display: block;
      background: var(--surface);
    }

    .listing-body {
      padding: 13px;
    }

    .badges {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 8px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      min-height: 25px;
      padding: 0 8px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 900;
      background: var(--surface);
      color: var(--text);
    }

    .badge.boosted {
      background: var(--lime);
      color: #000;
    }

    .listing-title {
      margin: 0;
      font-size: 16px;
      line-height: 1.3;
      font-weight: 900;
    }

    .listing-description {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.4;

      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .price {
      margin-top: 10px;
      font-size: 17px;
      font-weight: 900;
    }

    .meta {
      margin-top: 5px;
      color: var(--muted);
      font-size: 12px;
    }

    .seller {
      margin-top: 9px;
      padding-top: 9px;
      border-top: 1px solid var(--border);
      color: var(--muted);
      font-size: 12px;
    }

    .view-btn {
      width: 100%;
      min-height: 42px;
      margin-top: 11px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-weight: 800;
    }

    .view-btn:active {
      transform: scale(0.98);
    }

    /* EMPTY */

    .empty {
      display: none;
      text-align: center;
      padding: 45px 20px;
      border: 1px dashed var(--border);
      border-radius: 18px;
      color: var(--muted);
    }

    .empty-icon {
      font-size: 38px;
      margin-bottom: 10px;
    }

    .empty strong {
      display: block;
      color: var(--text);
      margin-bottom: 6px;
      font-size: 17px;
    }

    /* BOTTOM NAV */

    .bottom-nav {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 100;
      height: 76px;
      background: #000;
      border-top: 1px solid var(--border);
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      padding: 7px 5px max(7px, env(safe-area-inset-bottom));
    }

    .nav-item {
      border: 0;
      background: transparent;
      color: var(--muted);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      min-width: 48px;
      min-height: 48px;
      font-size: 11px;
      font-weight: 800;
    }

    .nav-icon {
      font-size: 21px;
      line-height: 1;
    }

    .nav-item.active {
      color: var(--lime);
    }

    /* RESPONSIVE */

    @media (min-width: 700px) {
      .grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }

      .filters {
        grid-template-columns: 1fr 1fr;
      }
    }

    @media (max-width: 420px) {
      .grid {
        gap: 9px;
      }

      .listing-body {
        padding: 11px;
      }

      .listing-title {
        font-size: 15px;
      }

      .hero h1 {
        font-size: 24px;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <!-- HEADER -->
  <header>
    <div class="header-row">

      <div class="logo">
        Post<span>X</span>
      </div>

      <input
        id="searchInput"
        class="search"
        type="search"
        placeholder="Search products & services"
        autocomplete="off"
      >

      <button
        class="header-btn"
        type="button"
        aria-label="Inbox"
        onclick="location.href='inbox.html'"
      >
        💬
      </button>

    </div>
  </header>

  <!-- HERO -->
  <section class="hero">
    <div class="hero-card">

      <h1>PostX Marketplace</h1>

      <p>
        Buy, sell and discover products and services directly through PostX.
      </p>

      <div class="hero-actions">

        <button
          class="primary-btn"
          type="button"
          onclick="location.href='create-listing.html'"
        >
          ＋ Create Listing
        </button>

        <button
          class="secondary-btn"
          type="button"
          onclick="location.href='feed.html'"
        >
          View Social Feed
        </button>

      </div>

    </div>
  </section>

  <!-- SELL NOTICE -->
  <div class="notice">
    <strong>Sell on PostX — FREE</strong>
    <span>
      Create your own product or service listing for free.
      Boost is optional and costs KSh 10 if you want more views.
    </span>
  </div>

  <!-- FILTERS -->
  <section class="controls">

    <div class="tabs">

      <button
        class="tab active"
        type="button"
        data-type="all"
      >
        All
      </button>

      <button
        class="tab"
        type="button"
        data-type="product"
      >
        Products
      </button>

      <button
        class="tab"
        type="button"
        data-type="service"
      >
        Services
      </button>

    </div>

    <div class="filters">

      <select id="categoryFilter">
        <option value="all">All categories</option>
        <option value="electronics">Electronics</option>
        <option value="fashion">Fashion</option>
        <option value="beauty">Beauty</option>
        <option value="food">Food</option>
        <option value="home">Home</option>
        <option value="vehicles">Vehicles</option>
        <option value="jobs">Jobs & Services</option>
        <option value="software">Software</option>
        <option value="other">Other</option>
      </select>

      <select id="sortFilter">
        <option value="featured">Featured</option>
        <option value="newest">Newest</option>
        <option value="price-low">Price: Low to High</option>
        <option value="price-high">Price: High to Low</option>
      </select>

    </div>

  </section>

  <!-- CONTENT -->
  <main class="content">

    <p id="resultsInfo" class="results-info"></p>

    <div id="listingGrid" class="grid"></div>

    <div id="emptyState" class="empty">

      <div class="empty-icon">🛍️</div>

      <strong>No listings found</strong>

      <div>
        Try another search or create your own listing.
      </div>

      <button
        class="primary-btn"
        style="margin-top:16px"
        type="button"
        onclick="location.href='create-listing.html'"
      >
        ＋ Create Listing
      </button>

    </div>

  </main>

</div>

<!-- BOTTOM NAV -->
<nav class="bottom-nav">

  <button
    class="nav-item"
    type="button"
    onclick="location.href='index.html'"
  >
    <span class="nav-icon">＋</span>
    <span>Create</span>
  </button>

  <button
    class="nav-item"
    type="button"
    onclick="location.href='feed.html'"
  >
    <span class="nav-icon">⌂</span>
    <span>Home</span>
  </button>

  <button
    class="nav-item active"
    type="button"
    onclick="location.href='catalog.html'"
  >
    <span class="nav-icon">🛍</span>
    <span>Market</span>
  </button>

  <button
    class="nav-item"
    type="button"
    onclick="location.href='inbox.html'"
  >
    <span class="nav-icon">💬</span>
    <span>Inbox</span>
  </button>

  <button
    class="nav-item"
    type="button"
    onclick="location.href='settings.html'"
  >
    <span class="nav-icon">⚙</span>
    <span>Settings</span>
  </button>

</nav>

<script>
  const STORAGE_KEY = "postx_posts";

  let activeType = "all";
  let listings = [];

  const demoListings = [
    {
      id: "demo-1",
      type: "product",
      marketplace: true,
      isListing: true,
      listing: true,
      title: "Premium Smart Watch",
      description: "Smart watch with fitness tracking and notifications.",
      price: 4500,
      currency: "KES",
      category: "electronics",
      location: "Kilifi",
      seller: "PostX Seller",
      rating: 4.8,
      boosted: true,
      isBoosted: true,
      boostPrice: 10,
      views: 1280,
      createdAt: Date.now() - 86400000
    },
    {
      id: "demo-2",
      type: "service",
      marketplace: true,
      isListing: true,
      listing: true,
      title: "Website & Web App Development",
      description: "Modern websites and web applications for businesses.",
      price: 2500,
      currency: "KES",
      category: "software",
      location: "Kenya",
      seller: "PostX Developer",
      rating: 5,
      boosted: true,
      isBoosted: true,
      boostPrice: 10,
      views: 940,
      createdAt: Date.now() - 172800000
    },
    {
      id: "demo-3",
      type: "product",
      marketplace: true,
      isListing: true,
      listing: true,
      title: "Business Laptop",
      description: "Reliable laptop suitable for work and school.",
      price: 28000,
      currency: "KES",
      category: "electronics",
      location: "Mombasa",
      seller: "PostX Seller",
      rating: 4.7,
      boosted: false,
      isBoosted: false,
      boostPrice: 0,
      views: 410,
      createdAt: Date.now() - 259200000
    }
  ];

  const grid = document.getElementById("listingGrid");
  const emptyState = document.getElementById("emptyState");
  const resultsInfo = document.getElementById("resultsInfo");
  const searchInput = document.getElementById("searchInput");
  const categoryFilter = document.getElementById("categoryFilter");
  const sortFilter = document.getElementById("sortFilter");

  function loadListings() {
    try {
      const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));

      if (Array.isArray(saved)) {
        listings = saved.filter(item =>
          item &&
          (
            item.marketplace === true ||
            item.isListing === true ||
            item.listing === true ||
            item.type === "product" ||
            item.type === "service"
          )
        );
      } else {
        listings = [];
      }
    } catch (error) {
      listings = [];
    }

    /*
      Demo listings are only shown when the user's marketplace
      does not contain any listings yet.
    */
    if (!listings.length) {
      listings = [...demoListings];
    }
  }

  function getType(item) {
    return String(item.type || "product").toLowerCase() === "service"
      ? "service"
      : "product";
  }

  function getTitle(item) {
    return (
      item.title ||
      item.name ||
      item.productName ||
      item.serviceName ||
      "Untitled Listing"
    );
  }

  function getDescription(item) {
    return (
      item.description ||
      item.caption ||
      "No description provided."
    );
  }

  function getCategory(item) {
    return String(
      item.category ||
      "other"
    ).toLowerCase();
  }

  function getPrice(item) {
    const value = Number(item.price);

    return Number.isFinite(value) ? value : 0;
  }

  function getSeller(item) {
    return (
      item.seller ||
      item.author ||
      item.username ||
      "PostX User"
    );
  }

  function getLocation(item) {
    return item.location || "Kenya";
  }

  function getViews(item) {
    const views = Number(item.views);

    return Number.isFinite(views) ? views : 0;
  }

  function getCreatedAt(item) {
    if (typeof item.createdAt === "number") {
      return item.createdAt;
    }

    const parsed = Date.parse(item.createdAt || "");

    if (!Number.isNaN(parsed)) {
      return parsed;
    }

    return Number(item.id) || 0;
  }

  function isBoosted(item) {
    return item.boosted === true || item.isBoosted === true;
  }

  function escapeHTML(value) {
    return String(value ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }

  function getImage(item) {
    return (
      item.imageUrl ||
      item.mediaUrl ||
      item.image ||
      ""
    );
  }

  function createPlaceholder(type) {
    return type === "service"
      ? "data:image/svg+xml;charset=UTF-8," +
        encodeURIComponent(`
          <svg xmlns="http://www.w3.org/2000/svg" width="800" height="650">
            <rect width="100%" height="100%" fill="#4B4F52"/>
            <text x="50%" y="48%" text-anchor="middle"
              fill="white" font-size="70">🛠</text>
            <text x="50%" y="62%" text-anchor="middle"
              fill="white" font-size="34"
              font-family="Arial">SERVICE</text>
          </svg>
        `)
      : "data:image/svg+xml;charset=UTF-8," +
        encodeURIComponent(`
          <svg xmlns="http://www.w3.org/2000/svg" width="800" height="650">
            <rect width="100%" height="100%" fill="#4B4F52"/>
            <text x="50%" y="48%" text-anchor="middle"
              fill="white" font-size="70">🛍</text>
            <text x="50%" y="62%" text-anchor="middle"
              fill="white" font-size="34"
              font-family="Arial">PRODUCT</text>
          </svg>
        `);
  }

  function formatPrice(price) {
    if (price === 0) {
      return "Price on request";
    }

    return "KSh " + price.toLocaleString("en-KE");
  }

  function render() {

    const search = searchInput.value
      .trim()
      .toLowerCase();

    const category = categoryFilter.value;
    const sort = sortFilter.value;

    let filtered = listings.filter(item => {

      const type = getType(item);
      const itemCategory = getCategory(item);

      const title = getTitle(item).toLowerCase();
      const description = getDescription(item).toLowerCase();
      const seller = getSeller(item).toLowerCase();
      const location = getLocation(item).toLowerCase();

      const matchesType =
        activeType === "all" ||
        type === activeType;

      const matchesCategory =
        category === "all" ||
        itemCategory === category;

      const matchesSearch =
        !search ||
        title.includes(search) ||
        description.includes(search) ||
        seller.includes(search) ||
        location.includes(search);

      return (
        matchesType &&
        matchesCategory &&
        matchesSearch
      );
    });

    if (sort === "featured") {

      filtered.sort((a, b) => {

        const boostDifference =
          Number(isBoosted(b)) -
          Number(isBoosted(a));

        if (boostDifference !== 0) {
          return boostDifference;
        }

        return getCreatedAt(b) - getCreatedAt(a);
      });

    } else if (sort === "newest") {

      filtered.sort(
        (a, b) =>
          getCreatedAt(b) -
          getCreatedAt(a)
      );

    } else if (sort === "price-low") {

      filtered.sort(
        (a, b) =>
          getPrice(a) -
          getPrice(b)
      );

    } else if (sort === "price-high") {

      filtered.sort(
        (a, b) =>
          getPrice(b) -
          getPrice(a)
      );
    }

    resultsInfo.textContent =
      filtered.length +
      (filtered.length === 1 ? " listing" : " listings");

    grid.innerHTML = "";

    if (!filtered.length) {

      emptyState.style.display = "block";
      return;
    }

    emptyState.style.display = "none";

    filtered.forEach(item => {

      const type = getType(item);
      const title = getTitle(item);
      const description = getDescription(item);
      const categoryName = getCategory(item);
      const seller = getSeller(item);
      const location = getLocation(item);
      const price = getPrice(item);
      const views = getViews(item);
      const image = getImage(item) || createPlaceholder(type);

      const card = document.createElement("article");

      card.className = "listing";

      card.innerHTML = `
        <img
          class="listing-image"
          src="${escapeHTML(image)}"
          alt="${escapeHTML(title)}"
          loading="lazy"
          onerror="this.src='${createPlaceholder(type)}'"
        >

        <div class="listing-body">

          <div class="badges">

            ${
              isBoosted(item)
                ? `<span class="badge boosted">🚀 Boosted</span>`
                : ""
            }

            <span class="badge">
              ${type === "service" ? "Service" : "Product"}
            </span>

          </div>

          <h2 class="listing-title">
            ${escapeHTML(title)}
          </h2>

          <p class="listing-description">
            ${escapeHTML(description)}
          </p>

          <div class="price">
            ${escapeHTML(formatPrice(price))}
          </div>

          <div class="meta">
            📍 ${escapeHTML(location)}
            · 👁 ${views.toLocaleString()}
          </div>

          <div class="seller">
            Seller: ${escapeHTML(seller)}
          </div>

          <button
            class="view-btn"
            type="button"
            data-id="${escapeHTML(item.id)}"
          >
            View Listing
          </button>

        </div>
      `;

      const viewButton =
        card.querySelector(".view-btn");

      viewButton.addEventListener("click", () => {

        const id = encodeURIComponent(item.id);

        location.href =
          "listing.html?id=" + id;
      });

      grid.appendChild(card);
    });
  }

  document.querySelectorAll(".tab").forEach(tab => {

    tab.addEventListener("click", () => {

      document
        .querySelectorAll(".tab")
        .forEach(button =>
          button.classList.remove("active")
        );

      tab.classList.add("active");

      activeType =
        tab.dataset.type || "all";

      render();
    });

  });

  searchInput.addEventListener(
    "input",
    render
  );

  categoryFilter.addEventListener(
    "change",
    render
  );

  sortFilter.addEventListener(
    "change",
    render
  );

  loadListings();
  render();
</script>
